name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Open or update the release PR, or tag and publish the release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # A tag pushed with GITHUB_TOKEN starts no workflow, so nightly would keep
      # naming the previous stable release until the next push to main.
      - name: Refresh nightly against the new release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run nightly.yml --ref main
