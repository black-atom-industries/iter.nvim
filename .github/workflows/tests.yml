name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2

      - name: Set up just, stylua, lua-language-server and Node
        uses: jdx/mise-action@v5

      - name: Install Node dependencies
        run: npm ci

      - name: Run checks
        shell: bash
        run: just checks
